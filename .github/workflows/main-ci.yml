name: Main CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust release and protocol window
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: rust:1.91.1-bookworm
    env:
      RUSTUP_TOOLCHAIN: 1.91.1
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install the protocol fixture interpreter
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3
      - name: Build Server, Runner and CLI
        run: cargo build --release --locked
      - name: Check Web session and Bearer boundaries
        run: python3 -B tests/e2e/web_session.py target/release/tend-server target/release/tend target/release/tend-runner
      - name: Check the Runner protocol window
        run: python3 -B tests/e2e/protocol_window.py target/release/tend-server target/release/tend target/release/tend-runner
      - name: Check the persistent Runner handoff budget
        run: cargo test --release --locked -p tend-server store::handoff
      - name: Check the packaged Runner upgrade entry
        shell: bash
        run: |
          bundle=$(mktemp -d)
          trap 'rm -rf "$bundle"' EXIT
          mkdir "$bundle/bin"
          install target/release/{tend-server,tend-runner,tend} scripts/tend-runner-{upgrade,retire-files} "$bundle/bin/"
          printf '%s\n' "$GITHUB_SHA" > "$bundle/REVISION"
          python3 -B tests/e2e/runner_upgrade.py "$bundle"
          python3 -B tests/e2e/runner_upgrade.py "$bundle" --trailing-dot-db
      - name: Check first queued artifact review across Runner replacement
        run: python3 -B tests/e2e/review_transition.py target/release/tend-server target/release/tend target/release/tend-runner --scenario artifact-replacement
      - uses: actions/upload-artifact@v7
        with:
          name: ci-rust
          path: |
            target/release/tend-server
            target/release/tend-runner
            target/release/tend
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  tsnet:
    name: Go tsnet
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CGO_ENABLED: "0"
    defaults:
      run:
        working-directory: transport/tsnet
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: transport/tsnet/go.mod
          cache: false
      - run: go test ./...
      - run: go build -o tend-tsnet .
      - uses: actions/upload-artifact@v7
        with:
          name: ci-tsnet
          path: transport/tsnet/tend-tsnet
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  web:
    name: Web checks and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web lint
      - run: pnpm --dir web format:check
      - run: pnpm --dir web test
      - run: pnpm --dir web build
      - uses: actions/upload-artifact@v7
        with:
          name: ci-web
          path: web/dist/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  package:
    name: Package Linux deployment artifacts
    if: github.ref == 'refs/heads/main'
    needs: [rust, tsnet, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ci-rust
          path: components/rust
      - uses: actions/download-artifact@v8
        with:
          name: ci-tsnet
          path: components/tsnet
      - uses: actions/download-artifact@v8
        with:
          name: ci-web
          path: components/web
      - run: bash .github/scripts/package-main-build.sh components deployment
      - name: Verify the published upgrade entry and revision
        run: |
          bundle=$(mktemp -d)
          trap 'rm -rf "$bundle"' EXIT
          tar -xzf "deployment/tend-ng-linux-amd64-${GITHUB_SHA}.tar.gz" -C "$bundle"
          test "$(cat "$bundle/REVISION")" = "$GITHUB_SHA"
          "$bundle/bin/tend-runner-upgrade" --help
      - uses: actions/upload-artifact@v7
        with:
          name: tend-ng-linux-amd64-${{ github.sha }}
          path: deployment/
          compression-level: 0
          if-no-files-found: error
          overwrite: true

  publish:
    name: Update main build prerelease
    if: github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: main-build-release
      queue: max
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: tend-ng-linux-amd64-${{ github.sha }}
          path: deployment
      - run: bash .github/scripts/publish-main-build.sh deployment
        env:
          GH_TOKEN: ${{ github.token }}
