name: Main CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust release and protocol window
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.91.1
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.91.1 --profile minimal
      - name: Build Server, Runner and CLI
        run: cargo build --release --locked
      - name: Check the Runner protocol window
        run: python3 -B tests/e2e/protocol_window.py target/release/tend-server target/release/tend target/release/tend-runner

  tsnet:
    name: Go tsnet
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: transport/tsnet
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: transport/tsnet/go.mod
          cache: false
      - run: go test ./...
      - run: go build

  web:
    name: Web checks and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web lint
      - run: pnpm --dir web format:check
      - run: pnpm --dir web test
      - run: pnpm --dir web build
