[workspace]
members = ["crates/protocol", "crates/codex-app", "crates/tend-server", "crates/tend-runner", "crates/tend-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[workspace.dependencies]
anyhow = "1.0"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12"
ureq = { version = "2.12", default-features = false, features = ["json"] }
uuid = { version = "1.18", features = ["v4"] }
protocol = { path = "crates/protocol" }
codex-app = { path = "crates/codex-app" }
